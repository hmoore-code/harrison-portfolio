<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active filter: solid black with the star</title>
<style>@font-face{font-family:"Archivo";src:url("../assets/fonts/archivo-variable.woff2") format("woff2");font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}</style>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>

<div style="width: 390px; height: 300px; box-sizing: border-box; background: #FAFAF7; color: #111; font-family: 'Archivo', system-ui, sans-serif; padding: 40px 20px">
  <div role="group" aria-label="Filter projects" style="display: flex; flex-wrap: wrap; gap: 8px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">
        <sc-if value="{{f.active}}" hint-placeholder-val="{{ false }}">
          <svg width="15" height="15" viewBox="0 0 100 100" aria-hidden="true"><polygon points="77.7,5.3 56.8,24.2 51.3,0 42.9,23 24.6,1.8 30.2,29.3 4,19.9 22.6,40.7 0,46.4 21.6,55 0.2,73.2 27.9,67.5 18.3,93.9 39.3,75.2 44.7,100 53.1,76.2 71.5,97.5 65.8,69.9 92.1,79.3 73.4,58.4 100,53 74.4,44.4 95.9,26 68.3,31.8" fill="#FAFAF7"/></svg>
        </sc-if>
        <span>{{f.label}}</span>
      </button>
    </sc-for>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":300}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 3 }; }
  renderVals() {
    const f = this.state.f;
    const labels = ['All', 'Helping people learn', 'Building communication tools', 'Designing compelling experiences'];
    return {
      filters: labels.map((label, i) => ({
        label,
        active: f === i,
        on: f === i ? 'true' : 'false',
        pick: () => this.setState({ f: i }),
        style: 'min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid #111; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; ' + (f === i ? 'background: #111; color: #FAFAF7;' : 'background: #FAFAF7; color: #111;')
      }))
    };
  }
}
</script>
</body>
</html>
